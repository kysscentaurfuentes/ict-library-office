# ICT-LIBRARY-OFFICE/nginx/default.conf

# =========================================================
# RATE LIMITING
# =========================================================
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {

    listen 80;

    server_name localhost;

    # =========================================================
    # SECURITY HEADERS
    # =========================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =========================================================
    # CONTENT SECURITY POLICY
    # =========================================================
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: http: https:;
        font-src 'self' data:;
        media-src 'self' blob:;
        connect-src
            'self'
            http://localhost
            http://localhost:4000
            http://localhost:5000
            ws:
            wss:
            https://ict-library-office-backend.onrender.com;
        frame-ancestors 'self';
    " always;

    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # =========================================================
    # MAX REQUEST SIZE
    # =========================================================
    client_max_body_size 50M;

    # =========================================================
    # GZIP COMPRESSION
    # =========================================================
    gzip on;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # =========================================================
    # FRONTEND
    # =========================================================
    location / {

        proxy_pass http://frontend:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================================
    # BACKEND API
    # =========================================================
    location /api/ {

        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:4000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================================
    # HEALTH CHECK
    # =========================================================
    location /health {

        proxy_pass http://backend:4000/health;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================================
    # GRAPHQL
    # =========================================================
    location /graphql {

        proxy_pass http://backend:4000/graphql;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================================
    # AI SERVICE
    # =========================================================
    location /ai/ {

        proxy_pass http://ai-service:5000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================================
    # HLS STREAMS
    # =========================================================
    location /hls/ {

        proxy_pass http://backend:4000/hls/;

        proxy_http_version 1.1;

        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
    }

    # =========================================================
    # WEBSOCKET SUPPORT
    # =========================================================
    location /socket.io/ {

        proxy_pass http://backend:4000/socket.io/;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}