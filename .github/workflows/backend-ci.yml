# ICT-LIBRARY-OFFICE/.github/workflows/backend-ci.yml

name: ICT Library Backend CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  backend-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript build
        run: npm run build

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Build Docker image
        run: docker build -f Dockerfile.prod -t ict-library-backend .

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag Docker image
        run: |
          docker tag ict-library-backend ghcr.io/${{ github.repository_owner }}/ict-library-backend:latest

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/ict-library-backend:latest