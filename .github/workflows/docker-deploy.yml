# ICT-LIBRARY-OFFICE/.github/workflows/docker-deploy.yml

name: ICT Library Docker CI/CD

on:
  push:
    branches:
      - main

jobs:

  docker:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # =====================================================
      # CHECKOUT REPOSITORY
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4



      # =====================================================
      # LOGIN TO GHCR
      # =====================================================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}



      # =====================================================
      # BUILD + PUSH FRONTEND
      # =====================================================
      - name: Build Frontend Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/ict-library-frontend:latest \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/ict-library-frontend:latest



      # =====================================================
      # BUILD + PUSH BACKEND
      # =====================================================
      - name: Build Backend Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/ict-library-backend:latest \
            -f backend/Dockerfile.prod \
            ./backend

      - name: Push Backend Image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/ict-library-backend:latest



      # =====================================================
      # BUILD + PUSH AI SERVICE
      # =====================================================
      - name: Build AI Service Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/ict-library-ai-service:latest \
            ./ai-service

      - name: Push AI Service Image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/ict-library-ai-service:latest