# ICT-LIBRARY-OFFICE/.github/workflows/frontend-ci.yml

name: Frontend CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  frontend-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript build
        run: npm run build

      - name: Build frontend Docker image
        run: docker build -t ict-library-frontend .

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag frontend Docker image
        run: |
          docker tag ict-library-frontend ghcr.io/${{ github.repository_owner }}/ict-library-frontend:latest
          docker tag ict-library-frontend ghcr.io/${{ github.repository_owner }}/ict-library-frontend:${{ github.sha }}

      - name: Push frontend Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/ict-library-frontend:latest
          docker push ghcr.io/${{ github.repository_owner }}/ict-library-frontend:${{ github.sha }}