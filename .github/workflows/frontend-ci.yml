# ICT-LIBRARY-OFFICE/.github/workflows/frontend-ci.yml

name: Frontend CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  frontend-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript build
        run: npm run build