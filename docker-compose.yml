# ICT-LIBRARY-OFFICE/docker-compose.yml

services:
  frontend:
    container_name: ict-frontend
    build: ./frontend
    restart: always

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

  backend:
    container_name: ict-backend
    build: ./backend
    restart: always

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    ports:
      - "4000:4000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    env_file:
      - ./backend/.env.docker

    environment:
      NODE_ENV: docker

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

      ai-service:
        condition: service_started

  ai-service:
    container_name: ict-ai-service
    build: ./ai-service
    restart: always

    ports:
      - "5000:5000"

    volumes:
      - ./ai-service:/app

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    container_name: ict-postgres
    image: postgres:16
    restart: always

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 5785498
      POSTGRES_DB: ict_library_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d

  redis:
    container_name: ict-redis
    image: redis:latest
    restart: always

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    container_name: ict-nginx
    image: nginx:latest
    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - frontend
      - backend
      - ai-service

volumes:
  postgres_data: