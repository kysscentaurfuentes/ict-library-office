# ICT-LIBRARY-OFFICE/docker-compose.yml
services:
  frontend:
    container_name: ict-frontend
    build: ./frontend
    restart: always

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

  backend:
    container_name: ict-backend
    build: ./backend
    restart: always

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    ports:
      - "4000:4000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    env_file:
      - ./backend/.env.docker

    environment:
      NODE_ENV: docker

    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: ict-postgres
    image: postgres:16
    restart: always

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 5785498
      POSTGRES_DB: ict_library_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d

volumes:
  postgres_data: