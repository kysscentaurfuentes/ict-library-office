# ICT-LIBRARY-OFFICE/docker/production/docker-compose.prod.yml

name: ict-library-prod

services:

  # =========================================================
  # FRONTEND
  # =========================================================
  frontend:
    container_name: ict-frontend-prod

    image: ghcr.io/kysscentaurfuentes/ict-library-frontend:latest

    restart: unless-stopped

    expose:
      - "80"

    depends_on:
      backend:
        condition: service_healthy



  # =========================================================
  # BACKEND API
  # =========================================================
  backend:
    container_name: ict-backend-prod

    image: ghcr.io/kysscentaurfuentes/ict-library-backend:latest

    restart: unless-stopped

    expose:
      - "4000"

    env_file:
      - ../../backend/.env.docker

    environment:
      NODE_ENV: production
      DOCKER_ENV: "true"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

      ai-service:
        condition: service_healthy



  # =========================================================
  # AI SERVICE
  # =========================================================
  ai-service:
    container_name: ict-ai-service-prod

    image: ghcr.io/kysscentaurfuentes/ict-library-ai-service:latest

    restart: unless-stopped

    expose:
      - "5000"

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s



  # =========================================================
  # POSTGRES DATABASE
  # =========================================================
  db:
    container_name: ict-postgres-prod

    image: postgres:16-alpine

    restart: unless-stopped

    env_file:
      - .env.prod

    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ../../backend/database/migrations:/docker-entrypoint-initdb.d:ro



  # =========================================================
  # REDIS CACHE
  # =========================================================
  redis:
    container_name: ict-redis-prod

    image: redis:7-alpine

    restart: unless-stopped

    expose:
      - "6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5



  # =========================================================
  # NGINX REVERSE PROXY
  # =========================================================
  nginx:
    container_name: ict-nginx-prod

    image: nginx:stable-alpine

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ../../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      frontend:
        condition: service_started

      backend:
        condition: service_healthy

      ai-service:
        condition: service_healthy



# =========================================================
# VOLUMES
# =========================================================
volumes:
  postgres_data_prod: