# ICT-LIBRARY-OFFICE/docker/development/docker-compose.dev.yml
name: ict-library-dev

services:

  # =========================================================
  # FRONTEND
  # =========================================================
  frontend:
    container_name: ict-frontend-dev

    build:
      context: ../../frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ../../frontend:/app
      - /app/node_modules

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s



  # =========================================================
  # BACKEND API
  # =========================================================
  backend:
    container_name: ict-backend-dev

    build:
      context: ../../backend
      dockerfile: Dockerfile.dev

    restart: unless-stopped

    ports:
      - "4000:4000"

    volumes:
      - ../../backend:/app
      - /app/node_modules

    env_file:
      - ../../backend/.env.docker

    environment:
      NODE_ENV: development
      DOCKER_ENV: "true"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

      ai-service:
        condition: service_healthy



  # =========================================================
  # AI SERVICE
  # =========================================================
  ai-service:
    container_name: ict-ai-service-dev

    build:
      context: ../../ai-service

    env_file:
      - ../../ai-service/.env.docker

    environment:
      DOCKER_ENV: "true"
    
    restart: unless-stopped

    ports:
      - "5000:5000"

    volumes:
      - ../../ai-service:/app

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s



  # =========================================================
  # POSTGRES DATABASE
  # =========================================================
  db:
    container_name: ict-postgres-dev

    image: postgres:16

    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ../../backend/database/migrations:/docker-entrypoint-initdb.d



  # =========================================================
  # REDIS CACHE
  # =========================================================
  redis:
    container_name: ict-redis-dev

    image: redis:latest

    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5



  # =========================================================
  # MEDIAMTX
  # =========================================================
  mediamtx:
    container_name: ict-mediamtx-dev

    image: bluenviron/mediamtx:latest

    restart: unless-stopped

    ports:
      - "8554:8554"
      - "8888:8888"

    volumes:
      - ../../mediamtx/mediamtx.yml:/mediamtx.yml


  # =========================================================
  # NGINX REVERSE PROXY
  # =========================================================
  nginx:
    container_name: ict-nginx-dev

    image: nginx:latest

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ../../nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      frontend:
        condition: service_healthy

      backend:
        condition: service_healthy

      ai-service:
        condition: service_healthy



# =========================================================
# VOLUMES
# =========================================================
volumes:
  postgres_data_dev: