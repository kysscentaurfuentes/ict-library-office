# ICT-LIBRARY-OFFICE/monitoring/prometheus.yml

global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:

  # =========================================================
  # ICT LIBRARY BACKEND (NODE.JS)
  # =========================================================
  - job_name: "ict-library-backend"

    metrics_path: /metrics

    static_configs:
      - targets:
          - "host.docker.internal:4000"



  # =========================================================
  # ICT AI CCTV SERVICE (FLASK + OPENCV + FFMPEG)
  # =========================================================
  - job_name: "ict-ai-service"

    metrics_path: /metrics

    static_configs:
      - targets:
          - "host.docker.internal:5000"



  # =========================================================
  # NODE EXPORTER (HOST MACHINE METRICS)
  # =========================================================
  - job_name: "node-exporter"

    static_configs:
      - targets:
          - "node-exporter:9100"



  # =========================================================
  # CADVISOR (DOCKER CONTAINER METRICS)
  # =========================================================
  - job_name: "cadvisor"

    static_configs:
      - targets:
          - "cadvisor:8080"



  # =========================================================
  # COLLECTD ROUTER METRICS
  # =========================================================
  - job_name: "collectd-router"

    static_configs:
      - targets:
          - "collectd-exporter:9103"



  # =========================================================
  # BLACKBOX ICMP / PING MONITORING
  # =========================================================
  - job_name: "blackbox-ping"

    metrics_path: /probe

    params:
      module: [ping]

    static_configs:
      - targets:

          # GOOGLE DNS
          - 8.8.8.8

          # CLOUDFLARE DNS
          - 1.1.1.1

          # ROUTER
          - 192.168.8.1

          # LOCAL MACHINE
          - host.docker.internal

    relabel_configs:

      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115



  # =========================================================
  # BLACKBOX HTTP MONITORING
  # =========================================================
  - job_name: "blackbox-http"

    metrics_path: /probe

    params:
      module: [http_2xx]

    static_configs:
      - targets:

          # FRONTEND
          - http://host.docker.internal:5173

          # BACKEND
          - http://host.docker.internal:4000/health

          # AI SERVICE
          - http://host.docker.internal:5000/health

          # GRAFANA
          - http://host.docker.internal:3000

          # PROMETHEUS
          - http://host.docker.internal:9090

    relabel_configs:

      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115



  # =========================================================
  # SNMP ROUTER MONITORING
  # =========================================================
  - job_name: "snmp-router"

    metrics_path: /snmp

    params:
      module: [if_mib]
      auth: [public_v2]

    static_configs:
      - targets:

          # ROUTER IP
          - 192.168.8.1

    relabel_configs:

      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: snmp-exporter:9116