# ICT-LIBRARY-OFFICE/monitoring/prometheus.yml

global:
  scrape_interval: 5s



scrape_configs:

  # =========================================================
  # BACKEND METRICS
  # =========================================================
  - job_name: "ict-library-backend"

    metrics_path: /metrics

    static_configs:
      - targets:
          - "host.docker.internal:4000"


  # =========================================================
  # NODE EXPORTER (HOST MACHINE METRICS)
  # =========================================================
  - job_name: "node-exporter"

    static_configs:
      - targets:
          - "node-exporter:9100"



  # =========================================================
  # CADVISOR (DOCKER CONTAINER METRICS)
  # =========================================================
  - job_name: "cadvisor"

    static_configs:
      - targets:
          - "cadvisor:8080"