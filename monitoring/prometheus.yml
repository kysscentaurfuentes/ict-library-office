# ICT-LIBRARY-OFFICE/monitoring/prometheus.yml

global:
  scrape_interval: 5s



scrape_configs:

  - job_name: "ict-library-backend"

    static_configs:
      - targets:
          - "host.docker.internal:4000"



  - job_name: "node-exporter"

    static_configs:
      - targets:
          - "node-exporter:9100"