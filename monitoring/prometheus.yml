# ICT-LIBRARY-OFFICE/monitoring/prometheus.yml

global:
  scrape_interval: 5s

scrape_configs:

  # =========================================================
  # BACKEND METRICS
  # =========================================================
  - job_name: "ict-library-backend"

    metrics_path: /metrics

    static_configs:
      - targets:
          - "host.docker.internal:4000"



  # =========================================================
  # NODE EXPORTER (HOST MACHINE METRICS)
  # =========================================================
  - job_name: "node-exporter"

    static_configs:
      - targets:
          - "node-exporter:9100"



  # =========================================================
  # CADVISOR (DOCKER CONTAINER METRICS)
  # =========================================================
  - job_name: "cadvisor"

    static_configs:
      - targets:
          - "cadvisor:8080"



  # =========================================================
  # AI SERVICE METRICS
  # =========================================================
  - job_name: "ict-ai-service"

    metrics_path: /metrics

    static_configs:
      - targets:
          - "host.docker.internal:5000"



  # =========================================================
  # BLACKBOX EXPORTER
  # =========================================================
  - job_name: "blackbox-ping"

    metrics_path: /probe

    params:
      module: [ping]

    static_configs:
      - targets:

          # GOOGLE DNS
          - 8.8.8.8

          # CLOUDFLARE DNS
          - 1.1.1.1

          # LOCALHOST
          - localhost

    relabel_configs:

      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115