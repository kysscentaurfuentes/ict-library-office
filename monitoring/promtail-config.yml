# ICT-LIBRARY-OFFICE/monitoring/promtail-config.yml
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ict-library-backend-logs

    static_configs:
      - targets:
          - localhost

        labels:
          job: ict-library-backend
          host: windows
          __path__: /logs/*.log