# ICT-LIBRARY-OFFICE/monitoring/docker-compose.monitoring.yml

name: ict-monitoring

services:

  # =========================================================
  # PROMETHEUS
  # =========================================================
  prometheus:
    image: prom/prometheus:latest

    container_name: ict-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

    restart: unless-stopped



  # =========================================================
  # GRAFANA
  # =========================================================
  grafana:
    image: grafana/grafana-oss:latest

    container_name: ict-grafana

    env_file:
      - .env.monitoring

    ports:
      - "3000:3000"

    environment:
      GF_PATHS_DATA: /var/lib/grafana

      # SMTP
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_FROM_ADDRESS: kysscentaur.fuentes@carsu.edu.ph
      GF_SMTP_FROM_NAME: ICT Security Alerts

    volumes:
      # Persistent Grafana Database
      - ./grafana-data:/var/lib/grafana

      # Grafana Main Config
      - ./grafana.ini:/etc/grafana/grafana.ini:ro

      # Auto-load Datasources
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

      # Auto-load Dashboards
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards-json:ro

    restart: unless-stopped

    depends_on:
      - prometheus
      - loki



  # =========================================================
  # LOKI (LOG STORAGE)
  # =========================================================
  loki:
    image: grafana/loki:3.7.2

    container_name: ict-loki

    ports:
      - "3100:3100"

    command: -config.file=/etc/loki/loki-config.yml

    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro

    restart: unless-stopped



  # =========================================================
  # PROMTAIL (LOG SHIPPER)
  # =========================================================
  promtail:
    image: grafana/promtail:latest

    container_name: ict-promtail

    command: -config.file=/etc/promtail/config.yml

    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - ../backend/logs:/logs:ro

    restart: unless-stopped

    depends_on:
      - loki



  # =========================================================
  # NODE EXPORTER (HOST METRICS)
  # =========================================================
  node-exporter:
    image: prom/node-exporter:latest

    container_name: ict-node-exporter

    ports:
      - "9100:9100"

    restart: unless-stopped



  # =========================================================
  # CADVISOR (DOCKER CONTAINER METRICS)
  # =========================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest

    container_name: ict-cadvisor

    ports:
      - "8081:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

    restart: unless-stopped