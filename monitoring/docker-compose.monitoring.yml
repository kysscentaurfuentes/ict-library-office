# ICT-LIBRARY-OFFICE/monitoring/docker-compose.monitoring.yml

name: ict-monitoring

services:

  # =========================================================
  # PROMETHEUS
  # =========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ict-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

    restart: unless-stopped

    depends_on:
      - blackbox-exporter
      - snmp-exporter
      - collectd-exporter

    networks:
      - monitoring-network

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3


  # =========================================================
  # GRAFANA
  # =========================================================
  grafana:
    image: grafana/grafana-oss:latest
    container_name: ict-grafana

    env_file:
      - .env.monitoring

    ports:
      - "3000:3000"

    environment:
      GF_PATHS_DATA: /var/lib/grafana

      # SMTP
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_FROM_ADDRESS: kysscentaur.fuentes@carsu.edu.ph
      GF_SMTP_FROM_NAME: ICT Security Alerts

    volumes:
      # Persistent Grafana Database
      - ./grafana-data:/var/lib/grafana

      # Grafana Main Config
      - ./grafana.ini:/etc/grafana/grafana.ini:ro

      # Auto-load Datasources
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

      # Auto-load Dashboards
      # - ./grafana/dashboards:/etc/grafana/provisioning/dashboards-json:ro

    restart: unless-stopped

    depends_on:
      - prometheus
      - loki

    networks:
      - monitoring-network
      - prod-network

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3


  # =========================================================
  # LOKI (LOG STORAGE)
  # =========================================================
  loki:
    image: grafana/loki:3.7.2
    container_name: ict-loki

    ports:
      - "3101:3100"

    command:
      - -config.file=/etc/loki/loki-config.yml

    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro

    restart: unless-stopped

    networks:
      - monitoring-network

    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 30s
      timeout: 10s
      retries: 3


  # =========================================================
  # PROMTAIL (LOG SHIPPER)
  # =========================================================
  promtail:
    image: grafana/promtail:latest
    container_name: ict-promtail

    command:
      - -config.file=/etc/promtail/config.yml

    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - ../backend/logs:/logs:ro

    restart: unless-stopped

    depends_on:
      - loki

    networks:
      - monitoring-network

    healthcheck:
      test: ["CMD", "/usr/bin/promtail", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3


  # =========================================================
  # NODE EXPORTER (HOST METRICS)
  # =========================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: ict-node-exporter

    ports:
      - "9100:9100"

    restart: unless-stopped

    networks:
      - monitoring-network

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # =========================================================
  # CADVISOR (DOCKER CONTAINER METRICS)
  # =========================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ict-cadvisor

    ports:
      - "8081:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

    restart: unless-stopped

    networks:
      - monitoring-network


  # =========================================================
  # DOCKER ENGINE EXPORTER
  # =========================================================
  docker-exporter:
    build:
      context: ./docker-exporter

    container_name: ict-docker-exporter

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    ports:
      - "8082:8000"

    restart: unless-stopped

    networks:
      - monitoring-network

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # =========================================================
  # BLACKBOX EXPORTER
  # =========================================================
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: ict-blackbox-exporter

    ports:
      - "9115:9115"

    command:
      - --config.file=/config/blackbox.yml

    volumes:
      - ./blackbox/blackbox.yml:/config/blackbox.yml:ro

    restart: unless-stopped

    networks:
      - monitoring-network

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9115/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3


  # =========================================================
  # SNMP EXPORTER
  # =========================================================
  snmp-exporter:
    image: prom/snmp-exporter:latest
    container_name: ict-snmp-exporter

    ports:
      - "9116:9116"

    volumes:
      - ./snmp/snmp.yml:/etc/snmp_exporter/snmp.yml:ro

    restart: unless-stopped

    networks:
      - monitoring-network

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9116/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3


  # =========================================================
  # COLLECTD EXPORTER (ROUTER TELEMETRY)
  # =========================================================
  collectd-exporter:
    image: prom/collectd-exporter:latest
    container_name: ict-collectd-exporter

    command:
      - '--collectd.listen-address=:25826'

    ports:
      - "9103:9103"
      - "25826:25826/udp"

    restart: unless-stopped

    networks:
      - monitoring-network

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9103/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3


# =========================================================
# NETWORKS
# =========================================================
networks:

  monitoring-network:
    driver: bridge

  prod-network:
    external: true
    name: ict-library-dev_default