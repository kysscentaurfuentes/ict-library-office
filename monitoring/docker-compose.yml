# ICT-LIBRARY-OFFICE/monitoring/docker-compose.yml

services:

  prometheus:
    image: prom/prometheus

    container_name: ict-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    restart: unless-stopped



  grafana:
    image: grafana/grafana-oss

    container_name: ict-grafana

    ports:
      - "3000:3000"

    environment:
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${GF_SMTP_USER}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=kysscentaur.fuentes@carsu.edu.ph
      - GF_SMTP_FROM_NAME=ICT Security Alerts

    volumes:
      - grafana-storage:/var/lib/grafana

    restart: unless-stopped



  loki:
    image: grafana/loki:3.7.2

    container_name: ict-loki

    ports:
      - "3100:3100"

    command: -config.file=/etc/loki/loki-config.yml

    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml

    restart: unless-stopped



  promtail:
    image: grafana/promtail:latest

    container_name: ict-promtail

    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - ../backend/logs:/logs

    command: -config.file=/etc/promtail/config.yml

    restart: unless-stopped



volumes:
  grafana-storage: