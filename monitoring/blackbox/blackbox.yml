# ICT-LIBRARY-OFFICE/monitoring/blackbox/blackbox.yml

modules:

  # =========================================================
  # HTTP CHECK
  # =========================================================
  http_2xx:

    prober: http

    timeout: 5s

    http:
      preferred_ip_protocol: "ip4"



  # =========================================================
  # PING CHECK
  # =========================================================
  ping:

    prober: icmp

    timeout: 5s

    icmp:
      preferred_ip_protocol: "ip4"